  <style>
    :root { --primary: #0A84FF; --navy: #1E3A6E; --cream: #FFFFFF; --gray: #6B7280; --border: #e2ead8; }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    h1 { font-size: 4rem; margin-bottom: 0.5rem; color: var(--primary); }
    h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--navy); }
    p { margin-bottom: 2rem; color: var(--gray); font-size: 1.1rem; }
    .btn { background: var(--primary); color: white; padding: 0.8rem 2rem; border-radius: 50px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
    .btn:hover { background: #0066CC; }
    footer { background: #132547; color: white; padding: 2rem; text-align: center; }
